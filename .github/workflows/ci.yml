name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  quality:
    name: Test, vet, and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Check repository whitespace
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD --

      - name: Lint shell scripts
        run: bash scripts/release/check-shell.sh

      - name: Verify modules
        run: |
          # shellcheck disable=SC1091
          source scripts/release/TOOLCHAIN.env
          [[ "$GO_VERSION" == "$V3NODE_RELEASE_GO_VERSION" ]]
          [[ $(go env GOVERSION) == "go${V3NODE_RELEASE_GO_VERSION}" ]]
          go mod download
          go mod verify

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -test ./...

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  controller-build:
    name: Controller linux/${{ matrix.arch }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build reproducible controller
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          source_date_epoch=$(git show -s --format=%ct HEAD)
          bash scripts/release/build-controller.sh \
            0.0.0-ci \
            "$SOURCE_COMMIT" \
            "$source_date_epoch" \
            "$TARGET_ARCH" \
            "dist/v3node-linux-${TARGET_ARCH}"

      - name: Validate controller artifact
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          binary="dist/v3node-linux-${TARGET_ARCH}"
          go version -m "$binary"
          go version -m "$binary" | grep -F ": go${GO_VERSION}"
          case "$TARGET_ARCH" in
            amd64)
              file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
              "$binary" version | grep -F "v3node 0.0.0-ci (commit ${SOURCE_COMMIT}"
              "$binary" version | grep -F 'linux/amd64)'
              ;;
            arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
          esac
