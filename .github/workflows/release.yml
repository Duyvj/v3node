name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the leading v; manual runs build artifacts but do not publish a release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.5
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      source-date-epoch: ${{ steps.metadata.outputs.source-date-epoch }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Resolve immutable build metadata
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$REF_NAME" == v* ]] || {
              printf 'release tag must start with v\n' >&2
              exit 1
            }
            version=${REF_NAME#v}
          else
            version=$REQUESTED_VERSION
          fi
          [[ "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]] || {
            printf 'release version is not valid SemVer: %s\n' "$version" >&2
            exit 1
          }
          commit=$(git rev-parse HEAD)
          [[ "$commit" == "$EXPECTED_COMMIT" ]] || {
            printf 'checked-out commit does not match GitHub event SHA\n' >&2
            exit 1
          }
          source_date_epoch=$(git show -s --format=%ct HEAD)
          [[ "$source_date_epoch" =~ ^[0-9]+$ ]] || {
            printf 'invalid source commit timestamp\n' >&2
            exit 1
          }
          {
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'source-date-epoch=%s\n' "$source_date_epoch"
          } >>"$GITHUB_OUTPUT"

      - name: Check repository and scripts
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD --
          bash scripts/release/check-shell.sh

      - name: Verify, test, and vet controller
        run: |
          # shellcheck disable=SC1091
          source scripts/release/TOOLCHAIN.env
          [[ "$GO_VERSION" == "$V3NODE_RELEASE_GO_VERSION" ]]
          [[ $(go env GOVERSION) == "go${V3NODE_RELEASE_GO_VERSION}" ]]
          go mod download
          go mod verify
          go test -count=1 ./...
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck -test ./...

  controller:
    name: Controller linux/${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build controller twice and compare
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source-date-epoch }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          bash scripts/release/build-controller.sh \
            "$RELEASE_VERSION" \
            "$SOURCE_COMMIT" \
            "$SOURCE_DATE_EPOCH" \
            "$TARGET_ARCH" \
            "dist/v3node-linux-${TARGET_ARCH}"

      - name: Validate controller
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.commit }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          binary="dist/v3node-linux-${TARGET_ARCH}"
          go version -m "$binary"
          go version -m "$binary" | grep -F ": go${GO_VERSION}"
          case "$TARGET_ARCH" in
            amd64)
              file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
              "$binary" version | grep -F "v3node ${RELEASE_VERSION} (commit ${SOURCE_COMMIT}"
              "$binary" version | grep -F 'linux/amd64)'
              ;;
            arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
          esac

      - name: Upload controller
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-controller-${{ matrix.arch }}
          path: dist/v3node-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sing-box:
    name: Patched sing-box linux/${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Build patched engine twice and compare
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          source engine-patches/sing-box/UPSTREAM.env
          mkdir -p dist
          bash scripts/release/build-sing-box.sh \
            "$TARGET_ARCH" \
            "dist/v3node-edge-${SING_BOX_VERSION}-p2-linux-${TARGET_ARCH}"

      - name: Validate engine and rendered configurations
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          source engine-patches/sing-box/UPSTREAM.env
          binary=$(realpath "dist/v3node-edge-${SING_BOX_VERSION}-p2-linux-${TARGET_ARCH}")
          go version -m "$binary"
          go version -m "$binary" | grep -F ": go${GO_VERSION}"
          case "$TARGET_ARCH" in
            amd64)
              file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
              "$binary" version | grep -Fx "sing-box version ${SING_BOX_VERSION}"
              "$binary" version | grep -F "Tags: ${SING_BOX_BUILD_TAGS}"
              V3NODE_TEST_SING_BOX="$binary" go test \
                -count=1 \
                -run '^TestSingBox(OfficialBinary|VLESSDataTransfer)$' \
                ./internal/engine
              ;;
            arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
          esac

      - name: Upload patched engine
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-edge-${{ matrix.arch }}
          path: dist/v3node-edge-*-p2-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sing-box-source:
    name: GPL source archive
    needs:
      - preflight
      - sing-box
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Download released amd64 engine for exact rebuild comparison
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-edge-amd64
          path: release-edge-amd64

      - name: Package patched source twice and compare
        env:
          SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source-date-epoch }}
        run: |
          source engine-patches/sing-box/UPSTREAM.env
          mkdir -p dist verify
          bash scripts/release/package-sing-box-source.sh \
            "$SOURCE_DATE_EPOCH" \
            "dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz"
          bash scripts/release/package-sing-box-source.sh \
            "$SOURCE_DATE_EPOCH" \
            "verify/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz"
          cmp --silent \
            "dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz" \
            "verify/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz"
          tar -tzf "dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz" \
            | grep -Fx "v3node-edge-${SING_BOX_VERSION}-p2-source/LICENSE" >/dev/null
          tar -tzf "dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz" \
            | grep -Fx "v3node-edge-${SING_BOX_VERSION}-p2-source/V3NODE-BUILD-METADATA.txt" >/dev/null
          tar -tzf "dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz" \
            | grep -Fx "v3node-edge-${SING_BOX_VERSION}-p2-source/vendor/modules.txt" >/dev/null

      - name: Rebuild packaged source without module downloads
        run: |
          source engine-patches/sing-box/UPSTREAM.env
          archive="dist/v3node-edge-${SING_BOX_VERSION}-p2-source.tar.gz"
          source_root="offline/v3node-edge-${SING_BOX_VERSION}-p2-source"
          mkdir -p offline/module-cache offline/build-cache
          tar -xzf "$archive" -C offline
          GOPROXY=off \
          GOSUMDB=off \
          GOMODCACHE="$PWD/offline/module-cache" \
          GOCACHE="$PWD/offline/build-cache" \
          TARGET_GOOS=linux \
          TARGET_GOARCH=amd64 \
            bash "$source_root/V3NODE-PATCHES/build.sh" \
              "$source_root" \
              offline/v3node-edge-offline-linux-amd64
          if find offline/module-cache -mindepth 1 -print -quit | grep -q .; then
            printf 'offline rebuild unexpectedly populated the module cache\n' >&2
            exit 1
          fi
          file offline/v3node-edge-offline-linux-amd64 \
            | grep -Eq 'ELF 64-bit.*x86-64'
          cmp --silent \
            offline/v3node-edge-offline-linux-amd64 \
            "release-edge-amd64/v3node-edge-${SING_BOX_VERSION}-p2-linux-amd64"

      - name: Upload corresponding GPL source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-edge-source
          path: dist/v3node-edge-*-p2-source.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  xray-compatibility:
    name: Xray compatibility linux/${{ matrix.arch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache: true

      - name: Fetch checksum-pinned official Xray
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p xray
          bash scripts/release/fetch-xray.sh "$TARGET_ARCH" xray/upstream.zip
          unzip -q xray/upstream.zip xray -d xray/extracted
          chmod 0755 xray/extracted/xray

      - name: Validate Xray and rendered configurations
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          source scripts/release/XRAY.env
          binary=$(realpath xray/extracted/xray)
          case "$TARGET_ARCH" in
            amd64)
              file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
              "$binary" version | grep -F "Xray ${XRAY_VERSION} "
              "$binary" version | grep -F " ${XRAY_COMMIT} "
              "$binary" version | grep -F ' linux/amd64)'
              V3NODE_TEST_XRAY="$binary" go test \
                -count=1 \
                -run '^TestXray(OfficialBinary|VLESSDataTransfer)$' \
                ./internal/engine
              ;;
            arm64)
              file "$binary" | grep -Eq 'ELF 64-bit.*ARM aarch64'
              ;;
          esac

  assemble:
    name: Assemble checksummed release
    needs:
      - preflight
      - controller
      - sing-box
      - sing-box-source
      - xray-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Render installer, manifest, and SHA256SUMS
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bash scripts/release/assemble-release.sh "$RELEASE_VERSION" dist
          shellcheck -x dist/install.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3node-${{ needs.preflight.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - preflight
      - assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: v3node-${{ needs.preflight.outputs.version }}
          path: dist

      - name: Verify final bundle
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          [[ -x install.sh ]] || chmod 0755 install.sh
          bash -n install.sh

      - name: Create immutable-tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'release already exists; refusing to replace assets\n' >&2
            exit 1
          fi
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${release_flags[@]}" \
            --title "v3node ${RELEASE_VERSION}"
