name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:

  test:
    name: Test, vet and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download locked modules
        run: GOEXPERIMENT=jsonv2 go mod download
      - name: Run tests and static analysis
        run: |
          GOEXPERIMENT=jsonv2 ./script/with-xray-core.sh go test ./...
          GOEXPERIMENT=jsonv2 ./script/with-xray-core.sh go vet ./...
          GOEXPERIMENT=jsonv2 ./script/with-xray-core.sh go test -race ./common/format ./api/v2board ./agent ./core/app/dispatcher ./core ./node ./limiter
      - name: Scan reachable Go vulnerabilities
        run: GOEXPERIMENT=jsonv2 ./script/with-xray-core.sh go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    needs: test
    strategy:
      matrix:
        # Include amd64 on all platforms.
        goos: [windows, freebsd, linux, darwin]
        goarch: [amd64, 386]
        exclude:
          # Exclude i386 on darwin.
          - goarch: 386
            goos: darwin
        include:
          # BEIGIN MacOS ARM64
          - goos: darwin
            goarch: arm64
          # END MacOS ARM64
          # BEGIN Linux ARM 5 6 7
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: linux
            goarch: arm
            goarm: 6
          - goos: linux
            goarch: arm
            goarm: 5
          # END Linux ARM 5 6 7
          # BEGIN Other architectures
          # BEGIN riscv64 & ARM64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: riscv64
          # END riscv64 & ARM64
          # BEGIN MIPS
          - goos: linux
            goarch: mips64
          - goos: linux
            goarch: mips64le
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips
          # END MIPS
          # BEGIN PPC
          - goos: linux
            goarch: ppc64
          - goos: linux
            goarch: ppc64le
          # END PPC
          # BEGIN FreeBSD ARM
          - goos: freebsd
            goarch: arm64
          - goos: freebsd
            goarch: arm
            goarm: 7
          # END FreeBSD ARM
          # BEGIN S390X
          - goos: linux
            goarch: s390x
          # END S390X
          # END Other architectures
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show workflow information
        id: get_filename
        run: |
          export _NAME=$(jq ".[\"$GOOS-$GOARCH$GOARM$GOMIPS\"].friendlyName" -r < .github/build/friendly-filenames.json)
          echo "GOOS: $GOOS, GOARCH: $GOARCH, GOARM: $GOARM, GOMIPS: $GOMIPS, RELEASE_NAME: $_NAME"
          echo "ASSET_NAME=$_NAME" >> $GITHUB_OUTPUT
          echo "ASSET_NAME=$_NAME" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5'

      - name: Get project dependencies
        run: |
          go mod download
      - name: Get release version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          echo "version=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Get other version
        if: ${{ github.ref_type != 'tag' }}
        run: |
          echo "version=${{ github.sha }}" >> $GITHUB_ENV
      - name: Build v3node
        run: |
          echo "version: $version"
          mkdir -p build_assets
          GOEXPERIMENT=jsonv2 ./script/with-xray-core.sh go build -v -o build_assets/v3node -trimpath -ldflags "-X 'github.com/Duyvj/v3node/cmd.version=$version' -s -w -buildid="
          cp build_assets/v3node build_assets/znode

      - name: Build Mips softfloat v3node
        if: matrix.goarch == 'mips' || matrix.goarch == 'mipsle'
        run: |
          echo "version: $version"
          GOEXPERIMENT=jsonv2 GOMIPS=softfloat ./script/with-xray-core.sh go build -v -o build_assets/v3node_softfloat -trimpath -ldflags "-X 'github.com/Duyvj/v3node/cmd.version=$version' -s -w -buildid="
          cp build_assets/v3node_softfloat build_assets/znode_softfloat
      - name: Rename Windows v3node
        if: matrix.goos == 'windows'
        run: |
          cd ./build_assets || exit 1
          mv v3node v3node.exe
          mv znode znode.exe
      - name: Prepare to release
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE
          LIST=('geoip' 'geosite')
          for i in "${LIST[@]}"
          do
            DOWNLOAD_URL="https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/${i}.dat"
            FILE_NAME="${i}.dat"
            echo -e "Downloading ${DOWNLOAD_URL}..."
            curl --fail --location --silent --show-error --retry 3 "${DOWNLOAD_URL}" -o ./build_assets/${FILE_NAME}
            test "$(wc -c < ./build_assets/${FILE_NAME})" -ge 1024
          done
      - name: Create ZIP archive
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../v3node-$ASSET_NAME.zip .
          popd || exit 1
          cp v3node-$ASSET_NAME.zip znode-$ASSET_NAME.zip
          for ZIP_FILE in v3node-$ASSET_NAME.zip znode-$ASSET_NAME.zip; do
            DGST=$ZIP_FILE.dgst
            for METHOD in {"md5","sha1","sha256","sha512"}
            do
              openssl dgst -$METHOD $ZIP_FILE | sed 's/([^)]*)//g' >>$DGST
            done
          done
      - name: Change the name
        run: |
          mv build_assets v3node-$ASSET_NAME
      - name: Upload files to Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: v3node-${{ steps.get_filename.outputs.ASSET_NAME }}
          path: |
            ./v3node-${{ steps.get_filename.outputs.ASSET_NAME }}.zip
            ./v3node-${{ steps.get_filename.outputs.ASSET_NAME }}.zip.dgst
            ./znode-${{ steps.get_filename.outputs.ASSET_NAME }}.zip
            ./znode-${{ steps.get_filename.outputs.ASSET_NAME }}.zip.dgst

  release:
    name: Publish GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          pattern: v3node-*
          merge-multiple: true
      - name: Publish release and checksums
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          name: V3Node ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            script/install.sh
            script/v3node.sh
            script/znode.sh
            release-assets/*.zip
            release-assets/*.zip.dgst
